name: Update README Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Zhong0118&show_icons=true&include_all_commits=true&line_height=28&card_width=520&title_color=2F80ED&text_color=333333&icon_color=2F80ED&border_color=2F80ED&bg_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Zhong0118&layout=compact&langs_count=8&card_width=360&title_color=2F80ED&text_color=333333&border_color=2F80ED&bg_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
